<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ranking geral do PredictSF atualizado a partir de um arquivo JSON estático.">
  <title>PredictSF Ranking</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            predict: {
              background: '#07162A',
              surface: '#102340',
              border: '#1E4B82',
              primary: '#2F80FF',
              muted: '#A9B6C9'
            }
          },
          fontFamily: {
            heading: ['Poppins', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --background: #07162A;
      --surface: #102340;
      --border: #1E4B82;
      --primary: #2F80FF;
      --text: #FFFFFF;
      --muted: #A9B6C9;
      --gold: #F5C542;
      --silver: #C8CED8;
      --bronze: #CD7F32;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(47, 128, 255, 0.24), transparent 34rem),
        linear-gradient(180deg, #07162A 0%, #07111F 100%);
      font-family: 'Inter', sans-serif;
    }

    .shell {
      width: min(100%, 700px);
      margin-inline: auto;
    }

    .ranking-panel {
      border: 1px solid rgba(30, 75, 130, 0.9);
      background: linear-gradient(180deg, rgba(16, 35, 64, 0.96), rgba(12, 27, 50, 0.96));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
    }

    .ranking-list {
      display: grid;
      gap: 0.75rem;
      animation: fade-in 520ms ease-out both;
    }

    .player-card {
      display: grid;
      grid-template-columns: 3rem 3.25rem minmax(0, 1fr) auto;
      align-items: center;
      gap: 1rem;
      min-width: 0;
      border: 1px solid rgba(30, 75, 130, 0.82);
      border-radius: 1rem;
      background: rgba(7, 22, 42, 0.58);
      padding: 0.9rem 1rem;
      transition: transform 200ms ease, border-color 200ms ease, box-shadow 200ms ease, background 200ms ease;
    }

    .player-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      background: rgba(14, 39, 73, 0.9);
      box-shadow: 0 12px 30px rgba(47, 128, 255, 0.14);
    }

    .rank-marker {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 3rem;
      color: var(--primary);
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1;
    }

    .rank-marker[data-medal="gold"] { color: var(--gold); }
    .rank-marker[data-medal="silver"] { color: var(--silver); }
    .rank-marker[data-medal="bronze"] { color: var(--bronze); }

    .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 3.25rem;
      height: 3.25rem;
      flex: 0 0 auto;
      border: 2px solid rgba(47, 128, 255, 0.34);
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary), var(--border));
      box-shadow: inset 0 1px 10px rgba(255, 255, 255, 0.16);
      color: var(--text);
      font-weight: 800;
    }

    .player-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 1rem;
      font-weight: 700;
    }

    .player-meta,
    .points-label,
    .state-message { color: var(--muted); }

    .points {
      min-width: 5.25rem;
      text-align: right;
    }

    .points-value {
      color: var(--primary);
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1;
    }

    .points-label {
      margin-top: 0.25rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .state-message {
      border: 1px dashed rgba(169, 182, 201, 0.35);
      border-radius: 1rem;
      padding: 1rem;
      text-align: center;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .player-card {
        grid-template-columns: 2.25rem 2.75rem minmax(0, 1fr) auto;
        gap: 0.75rem;
        padding: 0.85rem;
      }

      .rank-marker { width: 2.25rem; font-size: 1.15rem; }
      .avatar { width: 2.75rem; height: 2.75rem; }
      .points { min-width: 4.4rem; }
      .points-value { font-size: 1.1rem; }
    }
  </style>
</head>
<body class="bg-predict-background font-body">
  <main class="min-h-screen px-4 py-8 sm:px-6 sm:py-12" aria-labelledby="page-title">
    <section class="shell ranking-panel rounded-[1.75rem] p-5 sm:p-8">
      <header class="mb-8 text-center">
        <p class="mb-3 text-sm font-semibold uppercase tracking-[0.22em] text-predict-primary">Ranking Geral</p>
        <h1 id="page-title" class="font-heading text-4xl font-bold tracking-[-0.04em] sm:text-5xl">🏆 PredictSF</h1>
        <p class="mx-auto mt-4 max-w-md text-sm leading-6 text-predict-muted sm:text-base">
          Atualizado automaticamente a partir do arquivo <strong class="font-semibold text-white">ranking.json</strong>
        </p>
      </header>

      <div id="ranking-status" class="state-message" role="status">Carregando ranking...</div>
      <ol id="ranking-container" class="ranking-list" aria-label="Lista de jogadores do ranking PredictSF" hidden></ol>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
