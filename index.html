<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PredictSF | Ranking Geral</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #07162A;
            font-family: 'Inter', sans-serif;
            color: #FFFFFF;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
        }

        .poppins {
            font-family: 'Poppins', sans-serif;
        }

        .container-ranking {
            max-width: 700px;
            margin: 0 auto;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.6s ease-out;
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .header-subtitle {
            font-size: 1.125rem;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 8px;
        }

        .header-description {
            font-size: 0.875rem;
            color: #A9B6C9;
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        .player-card {
            background-color: #102340;
            border: 1px solid #1E4B82;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s ease;
            cursor: default;
        }

        .player-card:hover {
            border-color: #2F80FF;
            box-shadow: 0 8px 24px rgba(47, 128, 255, 0.12);
            transform: translateY(-2px);
        }

        .position {
            font-size: 1.75rem;
            font-weight: 700;
            min-width: 48px;
            text-align: center;
            color: #2F80FF;
        }

        .medal {
            font-size: 2rem;
            min-width: 48px;
            text-align: center;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2F80FF 0%, #1E4B82 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.25rem;
            flex-shrink: 0;
            border: 2px solid rgba(47, 128, 255, 0.3);
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .player-points {
            font-size: 0.875rem;
            color: #A9B6C9;
            font-weight: 400;
        }

        .points-display {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .points-value {
            font-weight: 600;
            font-size: 1.25rem;
            color: #2F80FF;
        }

        .points-label {
            font-size: 0.75rem;
            color: #A9B6C9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-message {
            color: #A9B6C9;
            padding: 24px 16px;
            text-align: center;
        }

        .status-error {
            color: #FFB4B4;
        }

        .footer {
            color: #A9B6C9;
            font-size: 0.75rem;
            margin-top: 24px;
            text-align: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        html {
            scroll-behavior: smooth;
        }

        /* Responsividade */
        @media (max-width: 640px) {
            .container-ranking {
                max-width: 100%;
            }

            .header-title {
                font-size: 2rem;
            }

            .player-card {
                padding: 14px;
                gap: 12px;
            }

            .avatar {
                width: 44px;
                height: 44px;
                font-size: 1.125rem;
            }

            .position {
                font-size: 1.5rem;
                min-width: 40px;
            }

            .medal {
                font-size: 1.75rem;
                min-width: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container-ranking">
        <!-- Header -->
        <header class="header">
            <h1 class="header-title poppins"><span aria-hidden="true">🏆</span> PredictSF</h1>
            <h2 class="header-subtitle poppins">Ranking Geral</h2>
            <p class="header-description">Atualizado automaticamente a partir da lista JSON desta página</p>
        </header>

        <!-- Ranking List -->
        <main class="ranking-list" id="rankingContainer" aria-live="polite" aria-busy="false">
            <p class="status-message">Carregando ranking...</p>
        </main>

        <footer class="footer">
            <span id="updatedAt">Ranking carregado a partir dos dados desta página</span>
            <span class="sr-only">Ranking atualizado pela lista JSON embutida nesta página</span>
        </footer>
    </div>

    <script type="application/json" id="rankingData">
[
    {
        "id": 1,
        "name": "Caleb",
        "avatar": "C",
        "points": 187
    },
    {
        "id": 2,
        "name": "Lucas",
        "avatar": "L",
        "points": 181
    },
    {
        "id": 3,
        "name": "Pedro",
        "avatar": "P",
        "points": 178
    },
    {
        "id": 4,
        "name": "João",
        "avatar": "J",
        "points": 154
    },
    {
        "id": 5,
        "name": "Maria",
        "avatar": "M",
        "points": 142
    },
    {
        "id": 6,
        "name": "Ana",
        "avatar": "A",
        "points": 135
    }
]
    </script>

    <script>
        const MEDALS = {
            1: '🥇',
            2: '🥈',
            3: '🥉'
        };

        const POINTS_FORMATTER = new Intl.NumberFormat('pt-BR');

        function isValidPlayer(player) {
            return Boolean(
                player &&
                typeof player.name === 'string' &&
                player.name.trim() &&
                typeof player.avatar === 'string' &&
                player.avatar.trim() &&
                Number.isFinite(player.points)
            );
        }

        function sortPlayers(players) {
            return players
                .filter(isValidPlayer)
                .sort((a, b) => b.points - a.points || a.name.localeCompare(b.name, 'pt-BR'));
        }

        function formatPoints(points) {
            return POINTS_FORMATTER.format(points);
        }

        function createPlayerCard(player, position) {
            const card = document.createElement('article');
            card.className = 'player-card';
            card.setAttribute('aria-label', `${position}º lugar: ${player.name} com ${formatPoints(player.points)} pontos`);

            const positionElement = document.createElement('div');
            if (MEDALS[position]) {
                positionElement.className = 'medal';
                positionElement.textContent = MEDALS[position];
                positionElement.setAttribute('aria-hidden', 'true');
            } else {
                positionElement.className = 'position';
                positionElement.textContent = position;
            }

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = player.avatar.trim().slice(0, 2).toUpperCase();
            avatar.setAttribute('aria-hidden', 'true');

            const info = document.createElement('div');
            info.className = 'player-info';

            const name = document.createElement('h3');
            name.className = 'player-name';
            name.textContent = player.name.trim();

            const positionLabel = document.createElement('div');
            positionLabel.className = 'player-points';
            positionLabel.textContent = `${position}º lugar`;

            info.appendChild(name);
            info.appendChild(positionLabel);

            const pointsDisplay = document.createElement('div');
            pointsDisplay.className = 'points-display';

            const pointsValue = document.createElement('div');
            pointsValue.className = 'points-value';
            pointsValue.textContent = formatPoints(player.points);

            const pointsUnit = document.createElement('div');
            pointsUnit.className = 'points-label';
            pointsUnit.textContent = player.points === 1 ? 'ponto' : 'pontos';

            pointsDisplay.appendChild(pointsValue);
            pointsDisplay.appendChild(pointsUnit);

            card.appendChild(positionElement);
            card.appendChild(avatar);
            card.appendChild(info);
            card.appendChild(pointsDisplay);

            return card;
        }

        function renderStatus(message, type = 'info') {
            const container = document.getElementById('rankingContainer');
            container.innerHTML = '';

            const status = document.createElement('p');
            status.className = `status-message status-${type}`;
            status.textContent = message;
            container.appendChild(status);
        }

        function renderRanking(players) {
            const container = document.getElementById('rankingContainer');
            container.innerHTML = '';

            const fragment = document.createDocumentFragment();
            players.forEach((player, index) => {
                fragment.appendChild(createPlayerCard(player, index + 1));
            });

            container.appendChild(fragment);
        }

        function renderUpdatedAt() {
            const updatedAt = document.getElementById('updatedAt');

            if (!updatedAt) {
                return;
            }

            updatedAt.textContent = `Atualizado em ${new Intl.DateTimeFormat('pt-BR', {
                dateStyle: 'short',
                timeStyle: 'short'
            }).format(new Date())}`;
        }

        function init() {
            try {
                const dataElement = document.getElementById('rankingData');
                const players = JSON.parse(dataElement.textContent);
                const sortedPlayers = sortPlayers(players);

                if (sortedPlayers.length === 0) {
                    renderStatus('Nenhum dado disponível no momento.');
                    return;
                }

                renderRanking(sortedPlayers);
                renderUpdatedAt();
            } catch (error) {
                console.error('Erro ao renderizar ranking:', error);
                renderStatus('Não foi possível renderizar o ranking. Confira os dados JSON desta página.', 'error');
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
