<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PredictSF | Ranking Geral</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #07162A;
            font-family: 'Inter', sans-serif;
            color: #FFFFFF;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
        }

        .poppins {
            font-family: 'Poppins', sans-serif;
        }

        .container-ranking {
            max-width: 700px;
            margin: 0 auto;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.6s ease-out;
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .header-subtitle {
            font-size: 1.125rem;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 8px;
        }

        .header-description {
            font-size: 0.875rem;
            color: #A9B6C9;
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        .player-card {
            background-color: #102340;
            border: 1px solid #1E4B82;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s ease;
            cursor: default;
        }

        .player-card:hover {
            border-color: #2F80FF;
            box-shadow: 0 8px 24px rgba(47, 128, 255, 0.12);
            transform: translateY(-2px);
        }

        .position {
            font-size: 1.75rem;
            font-weight: 700;
            min-width: 48px;
            text-align: center;
            color: #2F80FF;
        }

        .medal {
            font-size: 2rem;
            min-width: 48px;
            text-align: center;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2F80FF 0%, #1E4B82 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.25rem;
            flex-shrink: 0;
            border: 2px solid rgba(47, 128, 255, 0.3);
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .player-points {
            font-size: 0.875rem;
            color: #A9B6C9;
            font-weight: 400;
        }

        .points-display {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .points-value {
            font-weight: 600;
            font-size: 1.25rem;
            color: #2F80FF;
        }

        .points-label {
            font-size: 0.75rem;
            color: #A9B6C9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-message {
            color: #A9B6C9;
            padding: 24px 16px;
            text-align: center;
        }

        .status-error {
            color: #FFB4B4;
        }

        .footer {
            color: #A9B6C9;
            font-size: 0.75rem;
            margin-top: 24px;
            text-align: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        html {
            scroll-behavior: smooth;
        }

        /* Responsividade */
        @media (max-width: 640px) {
            .container-ranking {
                max-width: 100%;
            }

            .header-title {
                font-size: 2rem;
            }

            .player-card {
                padding: 14px;
                gap: 12px;
            }

            .avatar {
                width: 44px;
                height: 44px;
                font-size: 1.125rem;
            }

            .position {
                font-size: 1.5rem;
                min-width: 40px;
            }

            .medal {
                font-size: 1.75rem;
                min-width: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container-ranking">
        <!-- Header -->
        <header class="header">
            <h1 class="header-title poppins"><span aria-hidden="true">🏆</span> PredictSF</h1>
            <h2 class="header-subtitle poppins">Ranking Geral</h2>
            <p class="header-description">Atualizado automaticamente a partir do arquivo ranking.json</p>
        </header>

        <!-- Ranking List -->
        <main class="ranking-list" id="rankingContainer" aria-live="polite" aria-busy="false">
            <!-- Players will be rendered here -->
        </main>

        <footer class="footer">
            <span id="updatedAt">Pronto para atualização</span>
            <span class="sr-only">Ranking carregado a partir do arquivo ranking.json</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
